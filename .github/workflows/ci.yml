name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Тесты и локализация (Fedora 44)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v5

      - name: Установить зависимости
        run: |
          # gobject-introspection нужен для cairo-1.0.typelib: без него GTK
          # не стартует с GSK_RENDERER=cairo в контейнере.
          dnf install -y --setopt=install_weak_deps=False \
            freerdp \
            python3-gobject \
            gobject-introspection \
            cairo-gobject \
            gtk4 \
            libadwaita \
            libsecret \
            gettext \
            xorg-x11-server-Xvfb

      - name: Синтаксис и компиляция переводов
        run: |
          python3 -m compileall -q rdp_launcher
          ./tools/build-locales.sh --compile-only
          msgfmt --check po/ru.po

      - name: Шаблон переводов актуален
        run: |
          # Сравниваем набор msgid, а не файл целиком: заголовок шаблона
          # (POT-Creation-Date и прочее) зависит от версии gettext, а нам важно,
          # что в шаблоне ровно те строки, которые есть в коде.
          cp po/rdp-launcher.pot /tmp/committed.pot
          ./tools/build-locales.sh >/dev/null
          python3 - <<'PY'
          import pathlib
          import sys

          def msgids(path: str) -> list[str]:
              return sorted(
                  line for line in pathlib.Path(path).read_text(encoding="utf-8").splitlines()
                  if line.startswith("msgid ")
              )

          committed = msgids("/tmp/committed.pot")
          fresh = msgids("po/rdp-launcher.pot")
          if committed != fresh:
              only_committed = [m for m in committed if m not in fresh]
              only_fresh = [m for m in fresh if m not in committed]
              print("::error::po/rdp-launcher.pot устарел. Запустите ./tools/build-locales.sh --update и закоммитьте результат.")
              for title, items in (("только в шаблоне", only_committed), ("только в коде", only_fresh)):
                  for item in items[:10]:
                      print(f"{title}: {item}")
              sys.exit(1)
          print(f"шаблон актуален ({len(fresh)} строк)")
          PY

      - name: Тесты логики
        run: python3 tests/test_core.py -v

      - name: Дымовой тест интерфейса
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a python3 tests/smoke_gui.py

  rpm:
    name: Сборка RPM (Fedora 44)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v5

      - name: Установить сборочные зависимости
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build gettext desktop-file-utils tar gzip

      - name: Собрать пакет
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          mkdir -p ~/rpmbuild/{SOURCES,SRPMS,RPMS,BUILD,BUILDROOT}
          tar --transform "s,^\.,rdp-launcher-$VERSION," \
              --exclude=.git --exclude=__pycache__ --exclude='*.pyc' \
              -czf ~/rpmbuild/SOURCES/rdp-launcher-$VERSION.tar.gz .
          rpmbuild -ba packaging/rdp-launcher.spec

      - name: Содержимое пакета
        run: |
          rpm -qlp ~/rpmbuild/RPMS/noarch/rdp-launcher-*.noarch.rpm
          echo "--- проверка обязательных файлов ---"
          rpm -qlp ~/rpmbuild/RPMS/noarch/rdp-launcher-*.noarch.rpm > /tmp/files.txt
          for f in /usr/bin/rdp-launcher \
                   /usr/share/applications/io.github.rdplauncher.RdpLauncher.desktop \
                   /usr/share/icons/hicolor/scalable/apps/io.github.rdplauncher.RdpLauncher.svg \
                   /usr/share/metainfo/io.github.rdplauncher.RdpLauncher.metainfo.xml \
                   /usr/share/rdp-launcher/locale/ru/LC_MESSAGES/rdp-launcher.mo; do
            grep -qx "$f" /tmp/files.txt || { echo "::error::в пакете нет $f"; exit 1; }
          done
          echo "все ожидаемые файлы на месте"
