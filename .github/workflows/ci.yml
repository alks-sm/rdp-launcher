name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Тесты и локализация (Fedora 44)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v5

      - name: Установить зависимости
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            freerdp \
            python3-gobject \
            gtk4 \
            libadwaita \
            libsecret \
            gettext \
            xorg-x11-server-Xvfb

      - name: Синтаксис и сборка переводов
        run: |
          python3 -m compileall -q rdp_launcher
          ./tools/build-locales.sh
          msgfmt --check po/ru.po

      - name: Шаблон переводов актуален
        run: |
          # Закоммиченный .pot должен совпадать со свежесгенерированным
          # (строка POT-Creation-Date меняется при каждой генерации).
          cp po/rdp-launcher.pot /tmp/committed.pot
          ./tools/build-locales.sh >/dev/null
          grep -v '^"POT-Creation-Date' /tmp/committed.pot > /tmp/committed.clean
          grep -v '^"POT-Creation-Date' po/rdp-launcher.pot > /tmp/fresh.clean
          if ! cmp -s /tmp/committed.clean /tmp/fresh.clean; then
            echo "::error::po/rdp-launcher.pot устарел. Запустите ./tools/build-locales.sh --update и закоммитьте результат."
            exit 1
          fi
          echo "шаблон актуален"

      - name: Тесты логики
        run: python3 tests/test_core.py -v

      - name: Дымовой тест интерфейса
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a python3 tests/smoke_gui.py
