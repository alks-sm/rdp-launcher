name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Тесты и локализация (Fedora 44)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Установить зависимости
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            freerdp \
            python3-gobject \
            gtk4 \
            libadwaita \
            libsecret \
            gettext \
            xorg-x11-server-Xvfb

      - name: Синтаксис и сборка переводов
        run: |
          python3 -m compileall -q rdp_launcher
          ./tools/build-locales.sh
          msgfmt --check po/ru.po

      - name: Каталог переводов актуален
        run: |
          # шаблон должен пересобираться без изменений — иначе забыли прогнать build-locales.sh
          cp po/rdp-launcher.pot /tmp/before.pot
          ./tools/build-locales.sh >/dev/null
          diff -u /tmp/before.pot po/rdp-launcher.pot

      - name: Тесты логики
        run: python3 tests/test_core.py -v

      - name: Дымовой тест интерфейса
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a python3 tests/smoke_gui.py
